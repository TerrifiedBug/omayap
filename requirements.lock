# What omayap installs, locked to its bytes: sherpa-onnx and the one package it
# depends on, sherpa-onnx-core. Nothing else is in the closure.
#
# `pip install --require-hashes` refuses anything whose SHA-256 is not listed
# here, transitive dependencies included, so the index cannot serve different
# bytes than the ones reviewed at this commit.
#
# Sixteen hashes for two distributions, because the interpreter picks the wheel
# and this file covers every Python and both Linux architectures Omarchy might
# be running on. pip takes the wheel whose hash matches and rejects the rest.
#
# Regenerating after a version bump, hashes straight from the index:
#
#   python3 - <<'PY'
#   import json, urllib.request
#   version = "1.13.7"
#   for package in ("sherpa-onnx", "sherpa-onnx-core"):
#       url = f"https://pypi.org/pypi/{package}/{version}/json"
#       with urllib.request.urlopen(url) as response:
#           files = json.load(response)["urls"]
#       linux = [
#           f for f in files
#           if "manylinux" in f["filename"]
#           and ("x86_64" in f["filename"] or "aarch64" in f["filename"])
#       ]
#       print(f"{package}=={version} \\")
#       for wheel in sorted(linux, key=lambda f: f["filename"]):
#           print(f"    --hash=sha256:{wheel['digests']['sha256']} \\")
#   PY

